name: Validate plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate plugin.json manifest
        run: |
          if command -v claude &> /dev/null; then
            claude plugin validate .claude-plugin/plugin.json
          else
            echo "claude CLI not available — skipping manifest validation."
            echo "Falling back to basic JSON parse check:"
            python3 -c "import json; json.load(open('.claude-plugin/plugin.json'))" && echo "✔ JSON parses"
          fi

      - name: Check every skill has SKILL.md
        run: |
          set -e
          for d in skills/*/; do
            if [ ! -f "$d/SKILL.md" ]; then
              echo "✘ Missing SKILL.md in $d"
              exit 1
            fi
            echo "✔ $d/SKILL.md"
          done

      - name: Check no broken references/ links inside SKILL.md
        run: |
          python3 <<'EOF'
          import re, sys
          from pathlib import Path
          dead = []
          for skill_md in Path('skills').rglob('SKILL.md'):
              content = skill_md.read_text()
              for m in re.finditer(r'`(references/[^`]+)`', content):
                  target = skill_md.parent / m.group(1)
                  if not target.exists():
                      dead.append(f"{skill_md}: {m.group(1)}")
          if dead:
              print("✘ Broken references/ links found:")
              for d in dead:
                  print(f"  - {d}")
              sys.exit(1)
          print(f"✔ All references/ links in SKILL.md files resolve.")
          EOF

      - name: Verify init asset templates are present
        run: |
          set -e
          REQUIRED=(
            "playwright.config.ts.tmpl"
            "tsconfig.json.tmpl"
            "package.json.tmpl"
            ".eslintrc.tmpl"
            ".prettierrc.tmpl"
            ".gitignore.tmpl"
            ".env.example.tmpl"
            "global-setup.ts.tmpl"
            "base-page.ts.tmpl"
            "base-grid-page.ts.tmpl"
            "base-edit-page.ts.tmpl"
            "base-pages-fixture.ts.tmpl"
            "common-test-functions.ts.tmpl"
            "login-page.ts.tmpl"
            "home-page.ts.tmpl"
            "AGENTS.md.tmpl"
            "README.md.tmpl"
          )
          for f in "${REQUIRED[@]}"; do
            if [ ! -f "skills/init/assets/$f" ]; then
              echo "✘ Missing init template: skills/init/assets/$f"
              exit 1
            fi
          done
          echo "✔ All ${#REQUIRED[@]} required init templates present."
