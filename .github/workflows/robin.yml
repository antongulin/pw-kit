name: Robin

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  review:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: antongulin/robin/.github/workflows/review.yml@main
    secrets:
      LLM_API_KEY: ${{ secrets.ROBIN_LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.ROBIN_LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.ROBIN_LLM_MODEL }}
